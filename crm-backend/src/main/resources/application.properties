spring.application.name=crm

# ── Connexion PostgreSQL ────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/crm_db
spring.datasource.username=postgres
spring.datasource.password=Nambinina1
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────────────
# update : met à jour le schéma sans effacer les données existantes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Sécurité JWT ────────────────────────────────────────────────────────
# Durée de validité du token : 24 heures (86400000 ms)
# Le secret est utilisé pour signer et vérifier les tokens JWT (HS256)
app.jwt.secret=NDAwNTY3ODkwMTIzNDU2MDEyMzE0OTAxNTAxNTI0NDU2MDEyMzE0OTAxNTA
app.jwt.expiration-ms=86400000
