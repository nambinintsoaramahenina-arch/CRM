<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion CRM</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f0f2f5; }
        .login-card { background: white; padding: 2.5rem; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 340px; }
        .login-card h2 { margin-top: 0; margin-bottom: 1.5rem; text-align: center; color: #1e293b; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: .4rem; font-weight: 500; color: #475569; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 0.65rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; transition: border-color 0.2s; }
        .form-group input:focus { outline: none; border-color: #2563eb; }
        button { width: 100%; padding: 0.75rem; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 600; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .error-message { display: none; background-color: #fee2e2; color: #991b1b; padding: 0.7rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1rem; text-align: center; }
        .back-link { text-align: center; margin-top: 1.2rem; }
        .back-link a { color: #64748b; text-decoration: none; font-size: 0.85rem; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Connexion CRM</h2>
        <div id="errorAlert" class="error-message"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="identifiant">Identifiant / Email :</label>
                <input type="text" id="identifiant" name="identifiant" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="mdp">Mot de passe :</label>
                <input type="password" id="mdp" name="mdp" required autocomplete="current-password">
            </div>
            <button type="submit" id="submitBtn">Se connecter</button>
        </form>
        <div class="back-link">
            <a th:href="@{/}">← Retour à l'accueil</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const identifiant = document.getElementById('identifiant').value.trim();
            const mdp = document.getElementById('mdp').value;
            const errorAlert = document.getElementById('errorAlert');
            const submitBtn = document.getElementById('submitBtn');

            errorAlert.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Connexion en cours...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ identifiant, mdp })
                });

                if (!response.ok) {
                    let errMsg = 'Identifiant ou mot de passe incorrect.';
                    try {
                        const errData = await response.json();
                        if (errData && errData.message) errMsg = errData.message;
                    } catch (_) {}
                    errorAlert.textContent = errMsg;
                    errorAlert.style.display = 'block';
                    return;
                }

                const data = await response.json();
                if (data.token) {
                    localStorage.setItem('jwt_token', data.token);
                    document.cookie = "jwt_token=" + encodeURIComponent(data.token) + "; path=/; max-age=86400; SameSite=Lax";
                    window.location.href = '/';
                } else {
                    errorAlert.textContent = "Réponse inattendue du serveur.";
                    errorAlert.style.display = 'block';
                }
            } catch (err) {
                errorAlert.textContent = "Erreur de connexion au serveur.";
                errorAlert.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Se connecter';
            }
        });
    </script>
</body>
</html>
